<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Exam History - ExamPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/student/dashboard"><i class="bi bi-laptop me-2"></i>ExamPro</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/student/dashboard"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/student/results"><i class="bi bi-journal-check me-1"></i>Exam History</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="btn btn-outline-light btn-sm rounded-pill mt-1" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container flex-grow-1 py-5">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h2 class="fw-bold text-dark mb-0">My Exam History</h2>
            <p class="text-muted">Review your past examination performances</p>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Date & Time</th>
                            <th>Total Qs</th>
                            <th class="text-success">Correct</th>
                            <th class="text-danger">Wrong</th>
                            <th>Score</th>
                            <th>Percentage</th>
                            <th class="pe-4">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${results}">
                            <td class="ps-4 fw-medium text-dark" th:text="${#temporals.format(r.examDate, 'dd MMM yyyy, HH:mm')}"></td>
                            <td th:text="${r.totalQuestions}"></td>
                            <td class="text-success fw-bold" th:text="${r.correctAnswers}"></td>
                            <td class="text-danger fw-bold" th:text="${r.wrongAnswers}"></td>
                            <td><span class="fw-bold" th:text="${r.score}"></span></td>
                            <td th:text="${#numbers.formatDecimal(r.percentage, 1, 1) + '%'}"></td>
                            <td class="pe-4">
                                <span class="badge rounded-pill" th:classappend="${r.status == 'PASS' ? 'bg-success' : 'bg-danger'}" th:text="${r.status}"></span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(results)}">
                            <td colspan="7" class="text-center py-5">
                                <i class="bi bi-inbox text-muted fs-1 d-block mb-3"></i>
                                <h5 class="text-muted">No examination history found.</h5>
                                <a href="/student/exam/start" class="btn btn-primary rounded-pill mt-2">Take an Exam Now</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <small>&copy; 2026 Online Examination System</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

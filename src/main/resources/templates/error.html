<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - ExamPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="card border-0 shadow-lg text-center p-5" style="max-width: 500px; width: 100%;">
        <div class="mb-4 text-danger" style="font-size: 80px; line-height: 1;">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h1 class="fw-bold text-dark mb-3">Oops! Something went wrong.</h1>
        <p class="text-muted mb-4">We're sorry, but an unexpected error has occurred. Our team has been notified.</p>
        <a href="/" class="btn btn-primary rounded-pill px-4 shadow-sm"><i class="bi bi-house me-2"></i>Return to Home</a>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <small>&copy; 2026 Online Examination System</small>
    </div>
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Examination - ExamPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100" onload="startExamTimer([[${remainingSeconds}]])">

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-laptop me-2"></i>ExamPro - Active Session</span>
        <div class="timer-container ms-auto">
            <i class="bi bi-clock me-2"></i><span id="exam-timer">--:--</span>
        </div>
    </div>
</nav>

<div class="container py-4 flex-grow-1">
    <div class="row g-4">
        <!-- Question Area -->
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white border-bottom-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0 text-primary">Question <span th:text="${currentIndex + 1}"></span> of <span th:text="${totalQuestions}"></span></h5>
                    <span class="badge bg-light text-dark border"><i class="bi bi-tag me-1"></i> <span th:text="${question.subject}"></span></span>
                </div>
                <div class="card-body p-4">
                    <h4 class="mb-4 lh-base" th:text="${question.questionText}"></h4>

                    <form id="exam-form" th:action="@{/student/exam/answer}" method="post">
                        <input type="hidden" name="questionIndex" th:value="${currentIndex}">
                        <input type="hidden" name="questionId" th:value="${question.id}">
                        <input type="hidden" name="action" id="form-action" value="next">

                        <div class="list-group">
                            <label class="list-group-item d-flex gap-3 px-4 py-3 cursor-pointer">
                                <input class="form-check-input flex-shrink-0 mt-1" type="radio" name="answer" value="A" th:checked="${selectedAnswer == 'A'}">
                                <span>
                                    <strong class="me-2 text-primary">A.</strong> <span th:text="${question.optionA}"></span>
                                </span>
                            </label>
                            <label class="list-group-item d-flex gap-3 px-4 py-3 cursor-pointer">
                                <input class="form-check-input flex-shrink-0 mt-1" type="radio" name="answer" value="B" th:checked="${selectedAnswer == 'B'}">
                                <span>
                                    <strong class="me-2 text-primary">B.</strong> <span th:text="${question.optionB}"></span>
                                </span>
                            </label>
                            <label class="list-group-item d-flex gap-3 px-4 py-3 cursor-pointer">
                                <input class="form-check-input flex-shrink-0 mt-1" type="radio" name="answer" value="C" th:checked="${selectedAnswer == 'C'}">
                                <span>
                                    <strong class="me-2 text-primary">C.</strong> <span th:text="${question.optionC}"></span>
                                </span>
                            </label>
                            <label class="list-group-item d-flex gap-3 px-4 py-3 cursor-pointer">
                                <input class="form-check-input flex-shrink-0 mt-1" type="radio" name="answer" value="D" th:checked="${selectedAnswer == 'D'}">
                                <span>
                                    <strong class="me-2 text-primary">D.</strong> <span th:text="${question.optionD}"></span>
                                </span>
                            </label>
                        </div>
                    </form>
                </div>
                <div class="card-footer bg-white border-top-0 pb-4 px-4 d-flex justify-content-between">
                    <button class="btn btn-outline-secondary px-4 rounded-pill" th:disabled="${currentIndex == 0}" onclick="document.getElementById('form-action').value='prev'; document.getElementById('exam-form').submit();">
                        <i class="bi bi-arrow-left me-2"></i>Previous
                    </button>
                    
                    <button th:if="${currentIndex < totalQuestions - 1}" class="btn btn-primary px-5 rounded-pill" onclick="document.getElementById('form-action').value='next'; document.getElementById('exam-form').submit();">
                        Next <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                    
                    <button th:if="${currentIndex == totalQuestions - 1}" class="btn btn-success px-5 rounded-pill shadow" onclick="if(confirmSubmission(event)){document.getElementById('form-action').value='submit'; document.getElementById('exam-form').submit();}">
                        Submit Exam <i class="bi bi-check2-circle ms-2"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Navigator Area -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm sticky-top" style="top: 100px;">
                <div class="card-header bg-white pt-4 pb-2 px-4">
                    <h5 class="fw-bold mb-0">Question Navigator</h5>
                </div>
                <div class="card-body p-4 text-center">
                    <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
                        <!-- Iterating through indices to generate buttons.
                             We don't have the full answers map in context right now, 
                             so we just show current index as active. Real apps check map. -->
                        <span th:each="i : ${#numbers.sequence(0, totalQuestions - 1)}">
                            <button type="button" class="btn btn-sm rounded-circle question-nav-btn"
                                    th:classappend="${i == currentIndex ? 'current' : 'bg-light border'}"
                                    th:text="${i + 1}"
                                    th:onclick="'document.getElementById(\'form-action\').value=\'next\'; document.getElementById(\'exam-form\').action=\'/student/exam/question/' + ${i} + '\'; document.getElementById(\'exam-form\').submit();'">
                            </button>
                        </span>
                    </div>
                    
                    <div class="d-flex justify-content-around text-start border-top pt-3">
                        <div class="small"><span class="d-inline-block bg-primary rounded-circle me-1" style="width: 10px; height: 10px;"></span> Current</div>
                        <div class="small"><span class="d-inline-block bg-light border rounded-circle me-1" style="width: 10px; height: 10px;"></span> Unanswered</div>
                        <!-- We can't show answered easily without passing the full map to view, so we skip it for simplicity or assume user knows -->
                    </div>
                </div>
                <div class="card-footer bg-light p-3 text-center">
                    <button class="btn btn-danger w-100 fw-bold rounded-pill" onclick="if(confirmSubmission(event)){document.getElementById('form-action').value='submit'; document.getElementById('exam-form').submit();}">
                        Finish & Submit
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>

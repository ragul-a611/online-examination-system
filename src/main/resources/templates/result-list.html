<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Results - ExamPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/admin/dashboard"><i class="bi bi-shield-lock me-2"></i>ExamPro Admin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/questions">Questions</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/students">Students</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/results">Results</a></li>
            </ul>
            <div class="d-flex align-items-center">
                <a class="btn btn-outline-light btn-sm rounded-pill" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
            </div>
        </div>
    </div>
</nav>

<div class="container-fluid py-4 px-4 flex-grow-1">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h2 class="fw-bold text-dark mb-0">Examination Results</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="/admin/dashboard" class="text-decoration-none">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Results</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Exam Date</th>
                            <th>Student Name</th>
                            <th>Register Number</th>
                            <th>Score</th>
                            <th>Percentage</th>
                            <th class="pe-4">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${results}">
                            <td class="ps-4 text-muted small" th:text="${#temporals.format(r.examDate, 'dd-MMM-yyyy HH:mm')}"></td>
                            <td>
                                <span class="fw-medium text-dark" th:text="${r.student.fullName}"></span>
                            </td>
                            <td th:text="${r.student.registerNumber}"></td>
                            <td><span class="fw-bold text-primary" th:text="${r.score}"></span> <small class="text-muted">/ <span th:text="${r.totalQuestions * 10}"></span></small></td>
                            <td th:text="${#numbers.formatDecimal(r.percentage, 1, 1) + '%'}"></td>
                            <td class="pe-4">
                                <span class="badge rounded-pill" th:classappend="${r.status == 'PASS' ? 'bg-success' : 'bg-danger'}" th:text="${r.status}"></span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(results)}">
                            <td colspan="6" class="text-center py-4 text-muted">No results found yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer class="bg-white text-center py-3 mt-auto border-top">
    <div class="container">
        <small class="text-muted">&copy; 2026 Online Examination System</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

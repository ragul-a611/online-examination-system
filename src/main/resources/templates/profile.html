<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - ExamPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/student/dashboard"><i class="bi bi-laptop me-2"></i>ExamPro</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/student/dashboard"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/student/results"><i class="bi bi-journal-check me-1"></i>Exam History</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container flex-grow-1 py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4 text-center">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 80px; height: 80px; font-size: 32px;">
                        <i class="bi bi-person"></i>
                    </div>
                    <h4 class="fw-bold text-dark mb-0">My Profile</h4>
                </div>
                <div class="card-body p-4 p-md-5">
                    
                    <div th:if="${param.success}" class="alert alert-success" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>Profile updated successfully!
                    </div>

                    <form th:action="@{/student/profile/update}" th:object="${student}" method="post">
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small">Full Name</label>
                            <input type="text" class="form-control" th:field="*{fullName}" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small">Register Number</label>
                            <input type="text" class="form-control bg-light" th:field="*{registerNumber}" readonly>
                            <div class="form-text">Register number cannot be changed.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small">Email Address</label>
                            <input type="email" class="form-control bg-light" th:field="*{email}" readonly>
                            <div class="form-text">Email address cannot be changed.</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 shadow-sm"><i class="bi bi-save me-2"></i>Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <small>&copy; 2026 Online Examination System</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

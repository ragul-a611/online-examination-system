<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Questions - ExamPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/admin/dashboard"><i class="bi bi-shield-lock me-2"></i>ExamPro Admin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/questions">Questions</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/students">Students</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/results">Results</a></li>
            </ul>
            <div class="d-flex align-items-center">
                <a class="btn btn-outline-light btn-sm rounded-pill" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
            </div>
        </div>
    </div>
</nav>

<div class="container-fluid py-4 px-4 flex-grow-1">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h2 class="fw-bold text-dark mb-0">Manage Questions</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="/admin/dashboard" class="text-decoration-none">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Questions</li>
                </ol>
            </nav>
        </div>
        <div class="col-auto">
            <a href="/admin/questions/add" class="btn btn-primary rounded-pill shadow-sm"><i class="bi bi-plus-lg me-1"></i> Add New Question</a>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Question Text</th>
                            <th>Subject</th>
                            <th>Difficulty</th>
                            <th>Correct</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="q : ${questions}">
                            <td class="ps-4" th:text="${q.id}"></td>
                            <td>
                                <div class="text-truncate" style="max-width: 400px;" th:text="${q.questionText}"></div>
                            </td>
                            <td><span class="badge bg-secondary rounded-pill" th:text="${q.subject}"></span></td>
                            <td>
                                <span class="badge rounded-pill" th:classappend="${q.difficulty == 'Easy' ? 'bg-success' : (q.difficulty == 'Medium' ? 'bg-warning text-dark' : 'bg-danger')}" th:text="${q.difficulty}"></span>
                            </td>
                            <td class="fw-bold text-success" th:text="${'Option ' + q.correctAnswer}"></td>
                            <td class="text-end pe-4">
                                <a th:href="@{'/admin/questions/edit/' + ${q.id}}" class="btn btn-sm btn-outline-primary rounded-pill"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{'/admin/questions/delete/' + ${q.id}}" class="btn btn-sm btn-outline-danger rounded-pill" onclick="return confirm('Are you sure you want to delete this question?');"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(questions)}">
                            <td colspan="6" class="text-center py-4 text-muted">No questions found. Add some!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer class="bg-white text-center py-3 mt-auto border-top">
    <div class="container">
        <small class="text-muted">&copy; 2026 Online Examination System Admin Panel</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

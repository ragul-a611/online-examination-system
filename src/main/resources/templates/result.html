<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination Result - ExamPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/student/dashboard"><i class="bi bi-laptop me-2"></i>ExamPro</a>
        <div class="ms-auto">
            <a href="/student/dashboard" class="btn btn-outline-light btn-sm rounded-pill"><i class="bi bi-house me-1"></i>Back to Dashboard</a>
        </div>
    </div>
</nav>

<div class="container flex-grow-1 py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg text-center p-0 overflow-hidden">
                <div class="bg-primary bg-opacity-10 py-5">
                    <div th:if="${result.status == 'PASS'}" class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle mb-3 shadow" style="width: 80px; height: 80px; font-size: 40px;">
                        <i class="bi bi-trophy"></i>
                    </div>
                    <div th:if="${result.status == 'FAIL'}" class="d-inline-flex align-items-center justify-content-center bg-danger text-white rounded-circle mb-3 shadow" style="width: 80px; height: 80px; font-size: 40px;">
                        <i class="bi bi-x-circle"></i>
                    </div>
                    
                    <h2 class="fw-bold mb-1" th:text="${result.status == 'PASS' ? 'Congratulations!' : 'Better Luck Next Time!'}"></h2>
                    <p class="text-muted mb-0">You have successfully completed the examination.</p>
                </div>
                
                <div class="card-body p-5">
                    <h1 class="display-3 fw-bold text-gradient mb-0" th:text="${#numbers.formatDecimal(result.percentage, 1, 1) + '%'}"></h1>
                    <p class="fs-5 text-muted mb-4">Overall Score: <strong class="text-dark" th:text="${result.score}"></strong> / <span th:text="${result.totalQuestions * 10}"></span></p>
                    
                    <div class="row g-4 mt-2">
                        <div class="col-6 col-md-3">
                            <div class="p-3 bg-light rounded border">
                                <h3 class="fw-bold text-dark mb-1" th:text="${result.totalQuestions}"></h3>
                                <small class="text-muted text-uppercase fw-bold" style="font-size: 0.75rem;">Total Qs</small>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="p-3 bg-success bg-opacity-10 border border-success border-opacity-25 rounded">
                                <h3 class="fw-bold text-success mb-1" th:text="${result.correctAnswers}"></h3>
                                <small class="text-success text-uppercase fw-bold" style="font-size: 0.75rem;">Correct</small>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="p-3 bg-danger bg-opacity-10 border border-danger border-opacity-25 rounded">
                                <h3 class="fw-bold text-danger mb-1" th:text="${result.wrongAnswers}"></h3>
                                <small class="text-danger text-uppercase fw-bold" style="font-size: 0.75rem;">Wrong</small>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="p-3 bg-light rounded border">
                                <h3 class="fw-bold mb-1">
                                    <span class="badge" th:classappend="${result.status == 'PASS' ? 'bg-success' : 'bg-danger'}" th:text="${result.status}"></span>
                                </h3>
                                <small class="text-muted text-uppercase fw-bold" style="font-size: 0.75rem;">Status</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white border-top py-4">
                    <a href="/student/results" class="btn btn-outline-primary rounded-pill px-4 me-2"><i class="bi bi-journal-check me-2"></i>View History</a>
                    <a href="/student/dashboard" class="btn btn-primary rounded-pill px-4 shadow-sm"><i class="bi bi-house me-2"></i>Go to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

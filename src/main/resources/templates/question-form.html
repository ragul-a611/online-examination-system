<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Form - ExamPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/admin/dashboard"><i class="bi bi-shield-lock me-2"></i>ExamPro Admin</a>
    </div>
</nav>

<div class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                    <h4 class="fw-bold text-dark mb-0"><i class="bi bi-pencil-square me-2 text-primary"></i> <span th:text="${question.id == null ? 'Add New Question' : 'Edit Question'}"></span></h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/questions/save}" th:object="${question}" method="post">
                        <input type="hidden" th:field="*{id}">
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Question Text</label>
                            <textarea class="form-control" th:field="*{questionText}" rows="3" placeholder="Enter the question here..." required></textarea>
                        </div>
                        
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Option A</label>
                                <input type="text" class="form-control" th:field="*{optionA}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Option B</label>
                                <input type="text" class="form-control" th:field="*{optionB}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Option C</label>
                                <input type="text" class="form-control" th:field="*{optionC}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Option D</label>
                                <input type="text" class="form-control" th:field="*{optionD}" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Correct Answer</label>
                                <select class="form-select" th:field="*{correctAnswer}" required>
                                    <option value="A">Option A</option>
                                    <option value="B">Option B</option>
                                    <option value="C">Option C</option>
                                    <option value="D">Option D</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Subject</label>
                                <select class="form-select" th:field="*{subject}" required>
                                    <option value="Java">Java</option>
                                    <option value="DBMS">DBMS</option>
                                    <option value="HTML">HTML</option>
                                    <option value="CSS">CSS</option>
                                    <option value="JavaScript">JavaScript</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Difficulty</label>
                                <select class="form-select" th:field="*{difficulty}" required>
                                    <option value="Easy">Easy</option>
                                    <option value="Medium">Medium</option>
                                    <option value="Hard">Hard</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm"><i class="bi bi-save me-1"></i> Save Question</button>
                            <a href="/admin/questions" class="btn btn-light rounded-pill px-4 border">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-white text-center py-3 mt-auto border-top">
    <div class="container">
        <small class="text-muted">&copy; 2026 Online Examination System</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ExamPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-laptop me-2"></i>ExamPro</a>
        <a href="/" class="btn btn-outline-light btn-sm rounded-pill"><i class="bi bi-house me-1"></i>Back to Home</a>
    </div>
</nav>

<div class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow-lg border-0" style="max-width: 450px; width: 100%;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-dark text-white rounded-circle mb-3" style="width: 60px; height: 60px; font-size: 24px;">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h3 class="fw-bold text-dark">Admin Login</h3>
                <p class="text-muted">Secure access for administrators</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>Invalid username or password.
            </div>

            <form th:action="@{/login-process}" method="post">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Admin Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-badge"></i></span>
                        <input type="text" class="form-control border-start-0" name="username" placeholder="Enter username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control border-start-0" name="password" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 fw-bold shadow-sm">Login as Admin</button>
            </form>
            
            <div class="text-center mt-4 pt-3 border-top">
                <a href="/student-login" class="text-muted text-decoration-none small"><i class="bi bi-person me-1"></i>Student Login</a>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <small>&copy; 2026 Online Examination System</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
